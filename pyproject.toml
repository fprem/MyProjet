[project]
name = "jira-kpi"
version = "0.1.0"
description = "Dashboard KPI di team calcolati da dati Jira"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
e2e = ["pytest-playwright>=0.5"]


[project.scripts]
jira-kpi = "jira_kpi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_kpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["e2e: test end-to-end nel browser (richiede playwright)"]

[tool.coverage.run]
source = ["src/jira_kpi"]
branch = true
omit = ["src/jira_kpi/app/dashboard.py", "src/jira_kpi/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jira_kpi"]

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*"]
ignore_missing_imports = true
