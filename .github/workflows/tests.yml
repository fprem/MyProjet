name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: medicine_archive
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - run: flutter pub get
      # AIFA's list of medicine packs, for looking up barcodes offline. If AIFA
      # can't be reached the app is built without it and reads the text instead.
      - name: Build AIFA's medicine list into the app
        continue-on-error: true
        run: dart run tool/build_aifa_catalog.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v6
        with:
          name: medicine-archive-debug-apk
          path: medicine_archive/build/app/outputs/flutter-apk/app-debug.apk
      # Sign with the fixed release key when the repository has it as a secret,
      # so each new build installs over the last one.
      - name: Get the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MEDICINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with the debug key."
          fi
      - run: flutter build apk --release --split-per-abi
        env:
          MEDICINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # On every push, put the phone build on one pre-release so there is a
      # single link to download it from.
      - name: Publish the phone build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk medicine-archive.apk
          gh release view medicine-archive-latest >/dev/null 2>&1 || gh release create medicine-archive-latest \
            --prerelease --target "$GITHUB_SHA" --title "Medicine Archive (latest test build)" \
            --notes "Test build of the Medicine Archive Android app, updated on every push. Install medicine-archive.apk on an Android 6.0+ phone."
          gh release upload medicine-archive-latest medicine-archive.apk --clobber
