name: play-store-release
# Builds the signed app bundle (.aab) to upload to Google Play. Run it from the
# Actions tab (Run workflow) or by pushing a tag such as v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/project-thread-oxymi8"] # TEMP: check the workflow once
jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medicine_archive
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - run: flutter pub get
      # Unlike the test build, the store build must have AIFA's list inside.
      - name: Build AIFA's medicine list into the app
        run: dart run tool/build_aifa_catalog.dart
      - run: flutter analyze
      - run: flutter test
      # Google Play only takes a bundle signed with the same upload key each
      # time, so never fall back to the debug key here.
      - name: Get the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEDICINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Each upload to Play needs a higher version code, so use the run number.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
        env:
          MEDICINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # Check what Play will check: the target SDK, and that the bundle still
      # has no internet permission and is signed with the release key.
      - name: Check the bundle
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          MANIFEST=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB")
          TARGET=$(echo "$MANIFEST" | grep -o 'android:targetSdkVersion="[0-9]*"' | grep -o '[0-9]\+')
          echo "Target SDK: $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::Google Play needs target SDK 36 or higher, the bundle has $TARGET."
            exit 1
          fi
          if echo "$MANIFEST" | grep -q 'android.permission.INTERNET'; then
            echo "::error::The bundle asks for internet access."
            exit 1
          fi
          echo "$MANIFEST" | grep -o 'uses-permission[^>]*android:name="[^"]*"' || true
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"
      - uses: actions/upload-artifact@v6
        with:
          name: medicine-archive-aab-${{ github.run_number }}
          path: medicine_archive/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
